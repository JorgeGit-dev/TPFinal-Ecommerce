<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,400;0,600;0,700;0,800;1,100;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <title>Contacto</title>
  </head>
  <body>
    <header>
      <div class="div-logo">
        <a class="logo" href="../index.html">
          <img
            src="https://uploads.onecompiler.io/457hr62ux/458atquu9/logo.png"
            alt="Logo de la tienda online"
          />
        </a>
      </div>

      <nav class="header-nav">
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="./contacto.html">Contacto</a></li>
          <li>
            <!--👉 Agregado el link al carrito, con un ID para el contador -->
            <a
              href="./carrito.html"
              class="carrito-icono"
              aria-label="Ver carrito"
            >
              🛒 <span id="contador-carrito" aria-live="polite"></span>
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="contacto">
        <h1 class="titulo-contacto text-secondary">Contactanos</h1>
        <form class="form-contacto" action="" method="POST">
          <div class="grupo-input">
            <label for="email"> Tu correo electrónico: </label>
            <input id="email" type="email" name="email" required />
          </div>

          <div class="grupo-input">
            <label for="mensaje"> Tu mensaje: </label>
            <textarea id="mensaje" name="message" required></textarea>
          </div>

          <button class="btn bg-secpndary text-dark" type="submit">
            Enviar
          </button>
        </form>
      </section>
    </main>
    <footer>
      <p>Gracias por visitar nuestra tienda online.</p>
      <nav>
        <ul class="footer-list">
          <li>
            <img
              src="https://uploads.onecompiler.io/457hr62ux/458atquu9/whatsapp.png"
              alt="logo-whatsapp"
            />
          </li>
          <li>
            <img
              src="https://uploads.onecompiler.io/457hr62ux/458atquu9/instagram.png"
              alt="logo-instagram"
            />
          </li>
        </ul>
      </nav>
    </footer>

    <script src="../js/contacto.js" type="module"></script>
  </body>
</html>
